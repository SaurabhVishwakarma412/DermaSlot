
services:

  # ==========================================
  # Backend - Node.js + Express
  # ==========================================
  backend:
    image: saurabhkv/dermaslot-backend:latest
    container_name: dermaslot_backend
    restart: unless-stopped

    ports:
      - "5000:5000"

    env_file:
      - .env

    environment:
      NODE_ENV: production
      PORT: 5000

    volumes:
      - backend-uploads:/app/uploads

    networks:
      - dermaslot-network

    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O - http://127.0.0.1:5000/healthz || exit 1
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s


  # ==========================================
  # Frontend - React + Nginx
  # ==========================================
  frontend:
    image: saurabhkv/dermaslot-frontend:latest
    container_name: dermaslot_frontend
    restart: unless-stopped

    ports:
      - "80:80"

    depends_on:
      backend:
        condition: service_healthy

    networks:
      - dermaslot-network

    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O - http://127.0.0.1:80/healthz || exit 1
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s


# ==========================================
# Docker Network
# ==========================================
networks:
  dermaslot-network:
    driver: bridge


# ==========================================
# Persistent Volumes
# ==========================================
volumes:
  backend-uploads:
