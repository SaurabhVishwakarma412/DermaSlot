# Template for Kubernetes Secret
# To use:
#   1. Copy this file to k8s/secret.yaml (automatically ignored by git)
#   2. Fill in your real production credentials
#   3. Apply: kubectl apply -f k8s/secret.yaml
#
# OR create directly from your local backend/.env (Recommended):
#   kubectl create secret generic pedoderma-secrets --from-env-file=backend/.env

apiVersion: v1
kind: Secret
metadata:
  name: pedoderma-secrets
type: Opaque
stringData:
  MONGO_URI: "mongodb+srv://<username>:<password>@cluster.mongodb.net/dermaslot?retryWrites=true&w=majority"
  JWT_SECRET: "replace-with-a-long-secure-random-secret-key"
  CLOUD_NAME: "your-cloudinary-cloud-name"
  API_KEY: "your-cloudinary-api-key"
  API_SECRET: "your-cloudinary-api-secret"
  EMAIL_USER: "your-email@example.com"
  EMAIL_PASS: "your-email-app-password"
  ADMIN_PASSWORD: "YourSecureAdminPassword123"

