# 1. ConfigMap & Secrets
apiVersion: v1
kind: ConfigMap
metadata:
  name: pedoderma-config
data:
  NODE_ENV: "production"
  PORT: "5000"
  FRONTEND_URL: "https://pedoderma.example.com"
  CORS_ORIGIN: "https://pedoderma.example.com"
---
apiVersion: v1
kind: Secret
metadata:
  name: pedoderma-secrets
type: Opaque
stringData:
  MONGO_URI: "mongodb+srv://username:password@cluster.mongodb.net/dermaslot?retryWrites=true&w=majority"
  JWT_SECRET: "replace-with-a-long-random-secret"
  CLOUD_NAME: ""
  API_KEY: ""
  API_SECRET: ""
  EMAIL_USER: ""
  EMAIL_PASS: ""
  ADMIN_PASSWORD: ""
---
# 2. Backend Deployment & Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pedo-backend
  labels:
    app: pedo-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pedo-backend
  template:
    metadata:
      labels:
        app: pedo-backend
    spec:
      containers:
      - name: backend
        image: saurabhkv/project-pedo-backend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5000
        envFrom:
        - configMapRef:
            name: pedoderma-config
        - secretRef:
            name: pedoderma-secrets
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /healthz
            port: 5000
          initialDelaySeconds: 15
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /api/health
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: pedo-backend-service
spec:
  type: ClusterIP
  selector:
    app: pedo-backend
  ports:
  - port: 5000
    targetPort: 5000
---
# 3. Frontend Deployment & Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pedo-frontend
  labels:
    app: pedo-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pedo-frontend
  template:
    metadata:
      labels:
        app: pedo-frontend
    spec:
      containers:
      - name: frontend
        image: saurabhkv/project-pedo-frontend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 250m
            memory: 256Mi
        livenessProbe:
          httpGet:
            path: /healthz
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /healthz
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: pedo-frontend-service
spec:
  type: LoadBalancer
  selector:
    app: pedo-frontend
  ports:
  - port: 80
    targetPort: 80
---
# 4. Ingress Routing
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pedoderma-ingress
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/proxy-body-size: "20m"
spec:
  rules:
  - host: pedoderma.example.com
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: pedo-backend-service
            port:
              number: 5000
      - path: /uploads
        pathType: Prefix
        backend:
          service:
            name: pedo-backend-service
            port:
              number: 5000
      - path: /
        pathType: Prefix
        backend:
          service:
            name: pedo-frontend-service
            port:
              number: 80

