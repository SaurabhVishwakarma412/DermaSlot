name: Build and Deploy

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Backend Tests
        run: |
          cd backend
          npm ci || npm install
          npm test

      - name: Log in to Docker Hub
        if: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push Docker Images
        if: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/project-pedo-backend:latest ./backend
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/project-pedo-frontend:latest ./frontend
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/project-pedo-backend:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/project-pedo-frontend:latest

      - name: Deploy to Server via SSH
        if: ${{ secrets.EC2_HOST != '' && secrets.EC2_SSH_KEY != '' }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER || 'ubuntu' }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/devops-derma || git clone https://github.com/SaurabhVishwakarma412/PedoDerma.git ~/devops-derma
            cd ~/devops-derma
            docker-compose pull
            docker-compose up -d --remove-orphans

